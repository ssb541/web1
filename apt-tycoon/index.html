<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>단지 타이쿤 - 관리소장 이야기</title>
<style>
:root{
  --bg:#1b2631; --panel:#2b3a4b; --panel2:#233140; --edge:#0a1017; --hi:#4d6580; --txt:#eef3f8; --dim:#9fb2c6;
  --gold:#ffd95a; --good:#5fd47e; --bad:#ff6a5a; --warn:#ffb23f; --blue:#5aa8ff; --hudh:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font:13px/1.35 "Galmuri11","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#world{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#over{position:fixed;left:0;top:0;touch-action:none}
.panel{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--hi),0 4px 0 rgba(0,0,0,.35);border-radius:4px}
button{font:inherit;color:var(--txt);background:#3b5068;border:2px solid var(--edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.25);border-radius:3px;padding:4px 8px;cursor:pointer}
button:hover{background:#4a6482}
button:active{transform:translateY(1px)}
button:disabled,button.poor{opacity:.45;cursor:not-allowed}
button.on{background:#c98f1a;color:#1a1204}
button.good{background:#2f7f4a} button.bad{background:#a53b30} button.warn{background:#a8741a}
#hud{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:5px;padding:5px 6px;align-items:center;
  background:linear-gradient(#2f4054,#243241);border-bottom:3px solid var(--edge);box-shadow:0 3px 0 rgba(0,0,0,.3);z-index:5}
.chip{display:flex;align-items:center;gap:5px;background:#162230;border:2px solid var(--edge);border-radius:3px;padding:2px 6px;min-height:30px;white-space:nowrap}
.chip b{font-size:14px}
.chip small{color:var(--dim)}
.gauge{width:68px;height:12px;background:#0c141c;border:1px solid #000;position:relative;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;display:block;width:0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.spacer{flex:1}
#speed{display:flex;gap:3px}
#speed button{padding:3px 8px;min-width:34px;font-weight:700}
#stars{color:var(--gold);letter-spacing:1px}
#toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;display:flex;gap:5px;padding:6px;max-width:calc(100vw - 12px);overflow-x:auto;z-index:5;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tb{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:3px 4px;gap:0;line-height:1.15}
.tb .ti{font-size:20px}.tb .tn{font-size:11px}.tb .tc{font-size:10px;color:var(--gold)}
.tb.on .tc{color:#5a3a00}
#side{position:fixed;right:8px;top:calc(var(--hudh) + 10px);width:318px;max-height:calc(100vh - var(--hudh) - 92px);display:flex;flex-direction:column;z-index:4}
#tabs{display:flex;gap:2px;padding:4px 4px 0}
#tabs button{flex:1;border-radius:3px 3px 0 0;padding:5px 2px;font-size:12px}
#sidebody{overflow-y:auto;padding:8px;touch-action:pan-y}
#side.collapsed #sidebody{display:none}
#info{position:fixed;left:8px;top:calc(var(--hudh) + 10px);width:272px;padding:9px;z-index:4;max-height:calc(100vh - var(--hudh) - 92px);overflow-y:auto}
.hidden{display:none!important}
.sec{font-weight:700;color:var(--gold);margin:8px 0 4px;font-size:12px}
.sec:first-child{margin-top:0}
.hire-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.hire{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;padding:5px 6px}
.hire .hn{font-weight:700}.hire small{color:#c8d6e4;font-size:10.5px}
.srow{display:flex;gap:6px;align-items:center;padding:5px 6px;margin-bottom:3px;background:var(--panel2);border:2px solid var(--edge);border-radius:3px;cursor:pointer}
.srow.sel{border-color:var(--gold)}
.srow .stat{margin-left:auto;color:var(--dim);font-size:11px;text-align:right;max-width:130px}
.hint{color:var(--dim);font-size:11.5px;margin-top:6px;padding:6px;background:var(--panel2);border-radius:3px;border-left:3px solid var(--blue)}
.ev{background:var(--panel2);border:2px solid var(--edge);border-radius:3px;padding:6px;margin-bottom:6px}
.ev.sel{border-color:var(--gold)}
.evh{display:flex;justify-content:space-between;font-weight:700}
.bar{height:7px;background:#0c141c;border:1px solid #000;margin:4px 0}
.bar i{display:block;height:100%;background:var(--good)}
.evd{color:var(--dim);font-size:11.5px}
.evb{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;align-items:center;font-size:11.5px}
.evb button{padding:3px 6px;font-size:11.5px}
.row{display:flex;align-items:center;gap:6px;margin:3px 0}
.row .lb{width:58px;color:var(--dim)} .row .bar{flex:1;margin:0} .row .v{width:36px;text-align:right}
.chk{font-size:12px;margin:2px 0}.chk.ok{color:var(--good)}.chk.no{color:#c8d0d8}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:3px 4px;border-bottom:1px solid #1a2634;text-align:right}th{color:var(--dim);font-weight:400}td:first-child,th:first-child{text-align:left}
.badge{display:inline-block;padding:0 5px;border-radius:2px;background:#162230;border:1px solid #000;font-size:11px;margin-right:3px}
.red{color:#ff9b8c}.grn{color:#8be3a2}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hudh) + 10px);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:8;pointer-events:none;width:min(520px,calc(100vw - 20px))}
.toast{padding:6px 12px;border:2px solid var(--edge);border-radius:3px;background:#243241;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.35);animation:tin .2s ease-out;text-align:center}
.toast.good{background:#255a3a}.toast.bad{background:#7a2a22}.toast.warn{background:#6a4f16}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,12,18,.72);z-index:20;padding:12px}
#modal:empty{display:none}
#modal .box{max-width:560px;max-height:92vh;overflow:auto;padding:18px 20px;text-align:left}
#modal h1{margin:0 0 6px;font-size:22px;color:var(--gold)}
#modal h2{margin:12px 0 4px;font-size:14px;color:var(--gold)}
#modal p,#modal li{margin:3px 0;color:#dbe6f0}
#modal ul{padding-left:18px;margin:4px 0}
#modal .big{font-size:15px;padding:8px 22px;margin-top:12px}
kbd{background:#0c141c;border:1px solid #000;border-radius:2px;padding:0 4px;font-size:11px;color:var(--gold)}
@media (max-width:820px){
  :root{--hudh:84px}
  #hud{gap:4px;padding:4px 6px}
  #chip-inc,#h-hour,#h-rank{display:none}
  .chip{padding:2px 6px;min-height:26px;font-size:12px}.chip b{font-size:12.5px}
  .gauge{width:54px}
  #side{left:0;right:0;width:auto;top:auto;bottom:calc(var(--tbh,76px) + 8px);max-height:46vh;border-radius:4px 4px 0 0}
  #info{left:6px;right:6px;width:auto;top:calc(var(--hudh) + 6px);max-height:34vh}
  #toolbar{bottom:4px;left:4px;right:4px;transform:none;max-width:none}
  #side{max-height:calc(100vh - var(--hudh) - var(--tbh,76px) - 20px)}
  .tb{min-width:56px}
  #toasts{top:calc(var(--hudh) + 4px)}
}
</style>
</head>
<body>
<canvas id="world"></canvas>
<canvas id="over"></canvas>

<div id="hud">
  <div class="chip" title="보유 자금">💰 <b id="h-funds">0</b><small>만원</small></div>
  <div class="chip" id="chip-inc" title="이번 달 예상 수입 / 지출 (매월 말 정산)">📈 <b class="pos" id="h-inc">+0</b><small>/</small><b class="neg" id="h-exp">-0</b></div>
  <div class="chip" title="입주민 만족도">😊 <div class="gauge"><i id="h-satbar"></i></div><b id="h-sat">0%</b></div>
  <div class="chip" title="민원 게이지 - 100%가 되면 해임됩니다">📢 <div class="gauge"><i id="h-cmpbar"></i></div><b id="h-cmp">0%</b></div>
  <div class="chip" title="날짜 / 계절"><b id="h-date"></b><span id="h-season"></span><small id="h-hour"></small></div>
  <div class="chip" title="단지 등급 / 직책"><span id="stars"></span><small id="h-rank"></small></div>
  <div class="spacer"></div>
  <div id="speed">
    <button data-act="speed" data-v="0" title="일시정지 (Space)">⏸</button>
    <button data-act="speed" data-v="1" title="1배속 (1)">▶</button>
    <button data-act="speed" data-v="2" title="2배속 (2)">▶▶</button>
    <button data-act="speed" data-v="3" title="3배속 (3)">▶▶▶</button>
  </div>
  <button data-act="zoom" data-v="-1" title="축소 (-)">➖</button>
  <button data-act="zoom" data-v="1" title="확대 (+)">➕</button>
  <button data-act="save" title="저장 (자동 저장도 됩니다)">💾</button>
  <button data-act="load" title="저장한 게임 불러오기">📂</button>
  <button data-act="help" title="도움말">❓</button>
</div>

<div id="info" class="panel hidden"></div>
<div id="side" class="panel"><div id="tabs"></div><div id="sidebody"></div></div>
<div id="toolbar" class="panel"></div>
<div id="toasts"></div>
<div id="modal"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
