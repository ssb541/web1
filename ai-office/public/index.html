<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 AI 사무실</title>
<style>
  :root { --bg:#1d2033; --panel:#272b45; --line:#3b4166; --text:#e9ecff; --dim:#98a0c8; --accent:#ffcf5c; --ok:#6fe39a; --bad:#ff7a7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:2px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:1px; }
  #mode { margin-left:auto; font-size:12px; padding:3px 10px; border-radius:99px; background:var(--panel); border:1px solid var(--line); }
  main { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; padding:14px; max-width:1500px; margin:auto; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  canvas { width:100%; height:auto; display:block; border:4px solid var(--line); border-radius:6px; background:#000; image-rendering:pixelated; cursor:pointer; }
  .side { display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:12px; }
  .card h2 { margin:0 0 8px; font-size:14px; color:var(--accent); }
  label { display:block; font-size:12px; color:var(--dim); margin:6px 0 2px; }
  input,select,textarea,button { font:inherit; color:var(--text); background:#1a1d33; border:1px solid var(--line); border-radius:6px; padding:6px 8px; width:100%; }
  textarea { resize:vertical; min-height:70px; }
  .row { display:flex; gap:8px; } .row>* { flex:1; }
  input[type=color] { padding:0; height:32px; }
  button { background:var(--accent); color:#2a2000; font-weight:700; border:0; cursor:pointer; margin-top:8px; }
  button:hover { filter:brightness(1.08); }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:400; margin-top:0; width:auto; padding:2px 8px; font-size:12px; }
  .task { border-top:1px solid var(--line); padding:8px 0; }
  .task:first-child { border-top:0; }
  .badge { font-size:11px; padding:1px 8px; border-radius:99px; margin-right:6px; }
  .queued { background:#444a70; } .working { background:#ffcf5c; color:#2a2000; } .done { background:var(--ok); color:#06301a; } .failed { background:var(--bad); color:#400; }
  .task small { color:var(--dim); display:block; }
  pre { white-space:pre-wrap; word-break:break-word; background:#15172a; padding:8px; border-radius:6px; max-height:260px; overflow:auto; margin:6px 0 0; font:12px/1.5 ui-monospace,Consolas,monospace; }
  #list { max-height:360px; overflow:auto; }
  .hint { color:var(--dim); font-size:12px; }
  #err { color:var(--bad); font-size:12px; min-height:16px; }
</style>
</head>
<body>
<header>
  <h1>🏢 나의 AI 사무실</h1>
  <span id="mode">연결 중…</span>
</header>
<main>
  <div>
    <canvas id="c" width="1200" height="720"></canvas>
    <p class="hint">직원을 클릭하면 선택됩니다. 업무를 받으면 자리에 앉아 일하고, 끝나면 ✅ 표시가 떠요. 결과 파일은 <code>ai-office/workspace/직원ID/</code> 폴더에 저장됩니다.</p>
  </div>
  <div class="side">
    <div class="card">
      <h2>📝 업무 지시</h2>
      <label>담당 직원</label>
      <select id="who"></select>
      <label>할 일</label>
      <textarea id="text" placeholder="예) 이번 주 AI 뉴스 5가지를 요약해줘"></textarea>
      <button id="assign">업무 맡기기</button>
      <div id="err"></div>
    </div>
    <div class="card">
      <h2>👤 직원 채용</h2>
      <label>이름</label><input id="name" maxlength="12" placeholder="예) 픽셀">
      <div class="row">
        <div><label>역할</label>
          <select id="role">
            <option value="researcher">🔎 리서처</option>
            <option value="writer">✍️ 작가</option>
            <option value="developer">💻 개발자</option>
            <option value="planner">📋 기획자</option>
            <option value="translator">🌐 번역가</option>
            <option value="secretary" selected>🗂️ 비서</option>
          </select></div>
        <div style="max-width:54px"><label>옷</label><input type="color" id="color" value="#5b8def"></div>
        <div style="max-width:54px"><label>머리</label><input type="color" id="hair" value="#3a2a1a"></div>
      </div>
      <label>추가 지침 (선택)</label>
      <textarea id="prompt" style="min-height:44px" placeholder="비워두면 역할 기본 지침을 씁니다. 예) 항상 존댓말, 3줄 이내로 요약"></textarea>
      <button id="hire">채용하기</button>
    </div>
    <div class="card">
      <h2>📂 업무 현황</h2>
      <div id="list"><span class="hint">아직 업무가 없어요.</span></div>
    </div>
  </div>
</main>
<script src="office.js"></script>
</body>
</html>
