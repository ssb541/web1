<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2030">
  <title>박주임 키우기 RPG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="who">
        <canvas id="avatar" width="16" height="16"></canvas>
        <div class="whotx"><b>박주임</b><small id="whoTitle">-</small></div>
      </div>
      <div class="lvbox">
        <span id="lv" class="lv">Lv.1</span>
        <div class="bar"><i id="expFill"></i><span id="expText"></span></div>
      </div>
      <div class="chip" title="골드">💰 <b id="gold">0</b></div>
      <button id="btnMenu" class="btn">☰ 메뉴</button>
    </header>

    <main id="stage">
      <canvas id="cv" width="960" height="640"></canvas>
      <button id="btnAuto" class="autoBtn" type="button">🤖 AUTO OFF</button>
      <div id="feverChip" hidden></div>
      <div id="clock"><span id="clockIcon">☀️</span> <b id="clockTime">09:00</b> <small id="clockPhase">주간 근무</small><i id="clockBar"></i></div>
      <div id="alerts"></div>
      <div id="toasts"></div>
    </main>

    <footer id="bar">
      <div id="stick" aria-label="가상 조이스틱"><div id="knob"></div></div>
      <div id="skills"></div>
    </footer>

    <div id="panel" hidden>
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="tabs">
          <button data-tab="skills">스킬</button>
          <button data-tab="dex">도감</button>
          <button data-tab="promo">전직</button>
          <button data-tab="info">정보·설정</button>
          <button id="btnClose" class="close">✕</button>
        </div>
        <div id="panelBody"></div>
      </div>
    </div>

    <div id="settle" hidden>
      <div class="endbox">
        <div class="endtag" id="settleTag">퇴근 정산</div>
        <h2 id="settleTitle">1일차 근무 종료</h2>
        <div id="settleBody" class="grid"></div>
        <p id="settleMsg" class="help"></p>
        <button id="settleBtn" class="btn big">☀️ 09:00 다음 근무 시작</button>
      </div>
    </div>

    <div id="ending" hidden>
      <div class="endbox">
        <div class="endtag">HIDDEN ENDING</div>
        <h2>2027 퇴사 후<br>터프팅 공방 창업</h2>
        <canvas id="endAvatar" width="16" height="16"></canvas>
        <div id="endText"></div>
        <button id="endBtn" class="btn big">계속 플레이 (박사장)</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/gfx.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/save.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
