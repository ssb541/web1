<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>박주임의 당직 탈출</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; padding: 0; background: #f5f5f3; color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh; overflow: hidden;
  }
  .wrap {
    width: 100%; max-width: 480px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; background: #fff; border: 2px solid #1a1a1a; border-radius: 14px;
    box-shadow: 3px 3px 0 #1a1a1a;
  }
  .title { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
  .scores { display: flex; gap: 12px; font-size: 13px; font-weight: 700; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 4 / 3;
    background: #fff; border: 2px solid #1a1a1a; border-radius: 16px;
    box-shadow: 4px 4px 0 #1a1a1a; overflow: hidden; touch-action: manipulation;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 20px; text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay img { width: 96px; height: 96px; object-fit: contain; }
  .overlay h2 { margin: 0; font-size: 20px; font-weight: 800; }
  .overlay p { margin: 0; font-size: 13px; color: #555; line-height: 1.45; }
  .btn {
    margin-top: 4px; padding: 11px 24px; font-size: 15px; font-weight: 800;
    background: #1a1a1a; color: #fff; border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 2px 2px 0 #888;
  }
  .btn:active { transform: translateY(2px); }
  .hint {
    text-align: center; font-size: 12px; color: #666; font-weight: 500;
  }
</style>
</head>

const GROUND_Y = 300;
let best = Number(localStorage.getItem("parkjuim_best") || 0);
bestEl.textContent = best;

let state = "ready";
let score = 0;
let speed = 4.2;
let frame = 0;
let obstacles = [];
let items = [];
let clouds = [{x: 80, y: 55}, {x: 240, y: 40}, {x: 390, y: 65}];
let floatTexts = [];

const player = {
  x: 68, y: GROUND_Y - 64, w: 60, h: 64,
  vy: 0, jumps: 0, boostTimer: 0
};

function resetGame() {
  score = 0; speed = 4.2; frame = 0;
  obstacles = []; items = []; floatTexts = [];
  player.y = GROUND_Y - player.h; player.vy = 0; player.jumps = 0; player.boostTimer = 0;
  scoreEl.textContent = "0";
  state = "playing";
  overlay.classList.add("hidden");
}

function jump() {
  if (state !== "playing") return;
  if (player.jumps < 2) {
    player.vy = player.jumps === 0 ? -11.8 : -10.5;
    player.jumps++;
  }
}

function spawnObstacle() {
  const types = [
    { label: "민원!", w: 34, h: 38, kind: "box" },
    { label: "단수", w: 30, h: 46, kind: "tall" },
    { label: "주차", w: 42, h: 32, kind: "wide" }
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  obstacles.push({ x: 500, y: GROUND_Y - t.h, w: t.w, h: t.h, label: t.label });
}

function spawnItem() {
  const y = GROUND_Y - 90 - Math.random() * 65;
  items.push({ x: 500, y, w: 30, h: 30, kind: Math.random() < 0.65 ? "coffee" : "flyer" });
}

function gameOver() {
  state = "over";
  if (score > best) {
    best = score;
    localStorage.setItem("parkjuim_best", String(best));
    bestEl.textContent = best;
  }
  ovImg.src = IMG_TIRED.src;
  ovTitle.textContent = "민원에 걸렸다… 😵";
  ovDesc.innerHTML = `이번 당직 점수: <b>${score}점</b> (최고 ${best}점)<br>피로가 누적된다…`;
  startBtn.textContent = "다시 당직 서기 ↻";
  overlay.classList.remove("hidden");
}

function update() {
  if (state !== "playing") return;
  frame++;
  if (frame % 8 === 0) {
    score++;
    scoreEl.textContent = score;
  }
  speed = Math.min(8.8, 4.2 + score * 0.008);
  if (player.boostTimer > 0) player.boostTimer--;

  player.vy += 0.58;
  player.y += player.vy;
  if (player.y >= GROUND_Y - player.h) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.jumps = 0;
  }

  const spawnGap = Math.max(58, Math.floor(115 - speed * 5));
  if (frame % spawnGap === 0) spawnObstacle();
  if (frame % 135 === 40) spawnItem();

  for (const c of clouds) {
    c.x -= 0.6;
    if (c.x < -60) c.x = 520;
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    // forgiving hitbox
    const px = player.x + 14, py = player.y + 10, pw = player.w - 28, ph = player.h - 14;
    if (px < o.x + o.w - 4 && px + pw > o.x + 4 && py < o.y + o.h - 4 && py + ph > o.y + 4) {
      gameOver();
      return;
    }
    if (o.x + o.w < -20) obstacles.splice(i, 1);
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.x -= speed;
    if (player.x < it.x + it.w && player.x + player.w > it.x && player.y < it.y + it.h && player.y + player.h > it.y) {
      const pts = it.kind === "coffee" ? 15 : 8;
      score += pts;
      scoreEl.textContent = score;
      if (it.kind === "coffee") player.boostTimer = 45;
      floatTexts.push({ x: it.x, y: it.y, text: `+${pts}`, life: 28 });
      items.splice(i, 1);
      continue;
    }
    if (it.x + it.w < -20) items.splice(i, 1);
  }

  for (let i = floatTexts.length - 1; i >= 0; i--) {
    floatTexts[i].y -= 1.1;
    floatTexts[i].life--;
    if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, 480, 360);

  // Night crescent moon & minimal apartment silhouettes
  ctx.strokeStyle = "#d4d4d0";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(415, 58, 16, 0.3, Math.PI * 1.6);
  ctx.stroke();

  // Sparse clouds
  ctx.strokeStyle = "#e0e0dc";
  for (const c of clouds) {
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, 44, 14, 7);
    ctx.stroke();
  }

  // Ground line
  ctx.strokeStyle = "#1a1a1a";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(480, GROUND_Y);
  ctx.stroke();

  // Scrolling ground dashes
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "#999";
  const offset = (frame * speed) % 40;
  for (let x = -offset; x < 480; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y + 12);
    ctx.lineTo(x + 16, GROUND_Y + 12);
    ctx.stroke();
  }

  // Items
  ctx.font = "22px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const it of items) {
    ctx.fillText(it.kind === "coffee" ? "☕" : "📮", it.x + it.w/2, it.y + it.h/2);
  }

  // Obstacles
  for (const o of obstacles) {
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.roundRect(o.x, o.y, o.w, o.h, 6);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#1a1a1a";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(o.label, o.x + o.w/2, o.y + o.h/2 + 1);
  }

  // Player sprite with subtle bobbing
  const bob = (player.y >= GROUND_Y - player.h - 1 && state === "playing") ? Math.sin(frame * 0.35) * 2.5 : 0;
  const sprite = player.boostTimer > 0 ? IMG_COFFEE : IMG_OK;
  if (sprite.complete) {
    ctx.drawImage(sprite, player.x, player.y + bob, player.w, player.h);
  }

  // Float texts
  ctx.fillStyle = "#1a1a1a";
  ctx.font = "bold 14px sans-serif";
  for (const ft of floatTexts) {
    ctx.globalAlpha = ft.life / 28;
    ctx.fillText(ft.text, ft.x + 10, ft.y);
  }
  ctx.globalAlpha = 1;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  resetGame();
});
document.getElementById("stage").addEventListener("pointerdown", () => {
  if (state === "playing") jump();
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    if (state === "playing") jump();
    else resetGame();
  }
});

loop();
</script>
</body>
</html>
